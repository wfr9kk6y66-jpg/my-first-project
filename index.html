<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مشتل الحديقة</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f7f5;
    color:#222;
}

/* الهيدر */
header{
    background:#fff;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.nav{
    max-width:1100px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#217a3b;
    font-size:24px;
    font-weight:bold;
}

.cart-btn{
    background:#217a3b;
    color:white;
    border:0;
    padding:11px 16px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

/* الرئيسية */
.hero{
    background:linear-gradient(135deg,#e5f5e7,#f8fff8);
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    color:#17642f;
    font-size:38px;
    margin-bottom:12px;
}

.hero p{
    color:#59645c;
    font-size:18px;
}

/* المحتوى */
.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.toolbar{
    margin-bottom:25px;
}

.search{
    width:100%;
    padding:14px;
    border:1px solid #d5ddd6;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.category{
    border:1px solid #217a3b;
    background:white;
    color:#217a3b;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
}

.category.active,
.category:hover{
    background:#217a3b;
    color:white;
}

/* المنتجات */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
}

.product{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.product img{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#e8eee9;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin-bottom:8px;
}

.price{
    color:#217a3b;
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.add-btn{
    width:100%;
    background:#217a3b;
    color:white;
    border:0;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn:hover{
    background:#17642f;
}

.loading,
.empty{
    text-align:center;
    padding:50px;
    color:#69756c;
}

/* النافذة */
.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:200;
}

.modal{
    background:white;
    width:min(520px,92%);
    max-height:90vh;
    overflow:auto;
    margin:5vh auto;
    padding:22px;
    border-radius:18px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#eee;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

/* السلة */
.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.quantity{
    display:flex;
    align-items:center;
    gap:7px;
}

.quantity button{
    border:0;
    background:#e8f1e9;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
}

.total{
    font-size:21px;
    font-weight:bold;
    margin:20px 0;
}

/* النموذج */
.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #d5ddd6;
    border-radius:10px;
    font-size:15px;
}

.submit{
    width:100%;
    padding:14px;
    background:#17642f;
    color:white;
    border:0;
    border-radius:11px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.status{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

.success{
    background:#e4f6e7;
    color:#17642f;
}

.error{
    background:#fde8e8;
    color:#a11d1d;
}

footer{
    text-align:center;
    padding:30px;
    color:#69756c;
}

/* الهاتف */
@media(max-width:600px){

    .hero h1{
        font-size:30px;
    }

    .logo{
        font-size:20px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product img{
        height:150px;
    }

    .product-info{
        padding:11px;
    }
}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
🌿 مشتل الحديقة
</div>

<button class="cart-btn" onclick="openCart()">
🛒 السلة (<span id="cartCount">0</span>)
</button>

</div>

</header>


<section class="hero">

<h1>مرحباً بكم في مشتل الحديقة</h1>

<p>
أفضل النباتات والمنتجات لحديقتك
</p>

</section>


<main class="container">

<div class="toolbar">

<input
id="search"
class="search"
type="text"
placeholder="🔎 ابحث عن نبات أو منتج..."
oninput="renderProducts()"
>

<div id="categories" class="categories"></div>

</div>


<div id="products" class="products">

<div class="loading">
جاري تحميل المنتجات...
</div>

</div>

</main>


<footer>

مشتل الحديقة © 2026

</footer>


<!-- السلة -->

<div id="cartOverlay" class="overlay">

<div class="modal">

<div class="modal-header">

<h2>🛒 سلة المشتريات</h2>

<button class="close" onclick="closeCart()">
إغلاق
</button>

</div>


<div id="cartItems"></div>


<div class="total">

الإجمالي:
<span id="cartTotal">0</span>

</div>


<hr style="border:0;border-top:1px solid #eee;margin:20px 0">


<h3 style="margin-bottom:15px">
بيانات الطلب
</h3>


<div id="status" class="status"></div>


<div class="form-group">

<label>الاسم</label>

<input
id="customerName"
type="text"
placeholder="اكتب اسمك"
>

</div>


<div class="form-group">

<label>رقم الهاتف</label>

<input
id="phone"
type="tel"
placeholder="رقم الهاتف"
>

</div>


<div class="form-group">

<label>العنوان</label>

<textarea
id="address"
rows="3"
placeholder="العنوان بالتفصيل"
></textarea>

</div>


<div class="form-group">

<label>ملاحظات</label>

<textarea
id="notes"
rows="2"
placeholder="ملاحظات إضافية - اختياري"
></textarea>

</div>


<button class="submit" onclick="submitOrder()">

إرسال الطلب

</button>

</div>

</div>


<script>

/* =========================
   إعداد Supabase
========================= */

const SUPABASE_URL =
"https://vuysjwfgsdjiqbqirhjo.supabase.co";

/*
  ضع هنا Publishable Key أو anon key.

  لا تستخدم Service Role Key.
*/

const SUPABASE_KEY =
"ضع_المفتاح_هنا";


/* =========================
   المتغيرات
========================= */

let products = [];

let cart = [];

let activeCategory = "الكل";


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

const box =
document.getElementById("products");

box.innerHTML =
'<div class="loading">جاري تحميل المنتجات...</div>';

try{

const response = await fetch(

`${SUPABASE_URL}/rest/v1/products?select=*&order=created_at.desc`,

{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
`Bearer ${SUPABASE_KEY}`
}
}

);


if(!response.ok){

throw new Error("تعذر تحميل المنتجات");

}


products = await response.json();

renderCategories();

renderProducts();


}catch(error){

console.error(error);

box.innerHTML = `

<div class="empty">

لم يتم تحميل المنتجات.

<br><br>

تأكد من وضع مفتاح Supabase الصحيح.

</div>

`;

}

}


/* =========================
   التصنيفات
========================= */

function renderCategories(){

const categories = [

"الكل",

...new Set(

products
.map(product => product.category)
.filter(Boolean)

)

];


document.getElementById("categories").innerHTML =

categories.map(category => `

<button

class="category
${category === activeCategory ? "active" : ""}"

onclick="setCategory('${escapeAttr(category)}')"

>

${escapeHtml(category)}

</button>

`).join("");

}


function setCategory(category){

activeCategory = category;

renderCategories();

renderProducts();

}


/* =========================
   عرض المنتجات
========================= */

function renderProducts(){

const search =

document
.getElementById("search")
.value
.trim()
.toLowerCase();


const filtered = products.filter(product =>

(activeCategory === "الكل" ||
product.category === activeCategory)

&&

(!search ||
String(product.name)
.toLowerCase()
.includes(search))

);


const box =
document.getElementById("products");


if(!filtered.length){

box.innerHTML =

'<div class="empty">لا توجد منتجات حالياً.</div>';

return;

}


box.innerHTML = filtered.map(product => `

<article class="product">

<img

src="${escapeAttr(

product.image ||

"https://placehold.co/600x400?text=Plant"

)}"

alt="${escapeAttr(product.name)}"

>

<div class="product-info">

<h3>
${escapeHtml(product.name)}
</h3>

<div class="price">

${Number(product.price).toFixed(2)}

</div>

<button

class="add-btn"

onclick="addToCart(${Number(product.id)})"

>

أضف إلى السلة

</button>

</div>

</article>

`).join("");

}


/* =========================
   إضافة للسلة
========================= */

function addToCart(id){

const product =
products.find(
item => Number(item.id) === Number(id)
);


if(!product) return;


const existing =
cart.find(
item => Number(item.id) === Number(id)
);


if(existing){

existing.qty++;

}else{

cart.push({
...product,
qty:1
});

}


updateCart();

}


/* =========================
   تعديل الكمية
========================= */

function changeQty(id, amount){

const item =
cart.find(
item => Number(item.id) === Number(id)
);


if(!item) return;


item.qty += amount;


if(item.qty <= 0){

cart =
cart.filter(
item => Number(item.id) !== Number(id)
);

}


updateCart();

}


/* =========================
   تحديث السلة
========================= */

function updateCart(){

const count =
cart.reduce(
(total,item) => total + item.qty,
0
);


document.getElementById("cartCount")
.textContent = count;


const total =
cart.reduce(
(sum,item) =>
sum +
Number(item.price) * item.qty,
0
);


document.getElementById("cartTotal")
.textContent =
total.toFixed(2);


const box =
document.getElementById("cartItems");


if(!cart.length){

box.innerHTML =
'<div class="empty">السلة فارغة.</div>';

return;

}


box.innerHTML = cart.map(item => `

<div class="cart-item">

<div>

<strong>
${escapeHtml(item.name)}
</strong>

<br>

${Number(item.price).toFixed(2)}

</div>


<div class="quantity">

<button
onclick="changeQty(${Number(item.id)},1)"
>
+
</button>

<span>
${item.qty}
</span>

<button
onclick="changeQty(${Number(item.id)},-1)"
>
−
</button>

</div>

</div>

`).join("");

}


/* =========================
   فتح وإغلاق السلة
========================= */

function openCart(){

document.getElementById("cartOverlay")
.style.display = "block";

updateCart();

}


function closeCart(){

document.getElementById("cartOverlay")
.style.display = "none";

}


/* =========================
   إرسال الطلب
========================= */

async function submitOrder(){

hideStatus();


if(!cart.length){

showStatus(
"السلة فارغة.",
"error"
);

return;

}


const customer_name =
document
.getElementById("customerName")
.value
.trim();


const phone =
document
.getElementById("phone")
.value
.trim();


const address =
document
.getElementById("address")
.value
.trim();


const notes =
document
.getElementById("notes")
.value
.trim();


if(
!customer_name ||
!phone ||
!address
){

showStatus(
"أكمل الاسم ورقم الهاتف والعنوان.",
"error"
);

return;

}


const total =
cart.reduce(
(sum,item) =>
sum +
Number(item.price) * item.qty,
0
);


const items =
cart.map(item => ({

id:item.id,

name:item.name,

price:Number(item.price),

qty:item.qty

}));


try{

const response = await fetch(

`${SUPABASE_URL}/rest/v1/orders`,

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
`Bearer ${SUPABASE_KEY}`,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

customer_name,

phone,

address,

notes,

items,

total

})

}

);


if(!response.ok){

throw new Error(
"فشل إرسال الطلب"
);

}


showStatus(
"تم إرسال طلبك بنجاح 🌱",
"success"
);


cart = [];

updateCart();


document.getElementById("customerName")
.value = "";

document.getElementById("phone")
.value = "";

document.getElementById("address")
.value = "";

document.getElementById("notes")
.value = "";


}catch(error){

console.error(error);

showStatus(
"حدث خطأ أثناء إرسال الطلب.",
"error"
);

}

}


/* =========================
   الرسائل
========================= */

function showStatus(message,type){

const status =
document.getElementById("status");

status.textContent = message;

status.className =
`status ${type}`;

status.style.display = "block";

}


function hideStatus(){

document.getElementById("status")
.style.display = "none";

}


/* =========================
   حماية النصوص
========================= */

function escapeHtml(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char];

});

}


function escapeAttr(value){

return escapeHtml(value);

}


/* =========================
   تشغيل الموقع
========================= */

loadProducts();

</script>

</body>
</html>
