<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مشتل الحديقة</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#f5f7f5;
    color:#222;
}

/* الهيدر */
header{
    background:#fff;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 10px #00000012;
}

.top{
    max-width:1200px;
    margin:auto;
    padding:15px;
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#16823b;
    white-space:nowrap;
}

.search{
    flex:1;
    display:flex;
    background:#f1f3f1;
    border-radius:12px;
    overflow:hidden;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    padding:14px;
    font-size:16px;
}

.search button{
    border:0;
    background:#16823b;
    color:white;
    padding:0 20px;
    font-size:18px;
}

.cart{
    border:0;
    background:#16823b;
    color:white;
    border-radius:12px;
    padding:12px 15px;
    font-size:16px;
    cursor:pointer;
}

.nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    gap:10px;
    overflow:auto;
    padding:0 15px 12px;
}

.nav button{
    border:0;
    background:#eef5ef;
    color:#176c36;
    padding:10px 18px;
    border-radius:20px;
    white-space:nowrap;
}

/* البانر */
.hero{
    max-width:1200px;
    margin:20px auto;
    padding:40px 25px;
    border-radius:20px;
    background:linear-gradient(135deg,#176f38,#32a85b);
    color:white;
}

.hero h1{
    font-size:35px;
    margin-bottom:12px;
}

.hero p{
    font-size:18px;
    margin-bottom:22px;
}

.hero button{
    background:white;
    color:#176f38;
    border:0;
    padding:13px 25px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
}

/* الأقسام */
.container{
    max-width:1200px;
    margin:auto;
    padding:0 15px;
}

.title{
    margin:30px 0 15px;
    font-size:24px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.category{
    background:white;
    padding:20px 10px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 2px 8px #00000008;
    cursor:pointer;
}

.category .icon{
    font-size:35px;
    margin-bottom:8px;
}

.category b{
    color:#176f38;
}

/* المنتجات */
.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:40px;
}

.product{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 10px #0000000d;
}

.product img{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#eee;
}

.product-info{
    padding:14px;
}

.product h3{
    font-size:17px;
    margin-bottom:8px;
}

.price{
    color:#16823b;
    font-weight:bold;
    font-size:19px;
    margin-bottom:10px;
}

.add{
    width:100%;
    border:0;
    background:#16823b;
    color:white;
    padding:11px;
    border-radius:9px;
    font-size:15px;
    cursor:pointer;
}

/* الفوتر */
footer{
    background:#173d27;
    color:white;
    text-align:center;
    padding:30px 15px;
    margin-top:40px;
}

/* السلة */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:2000;
    padding:20px;
}

.box{
    background:white;
    max-width:500px;
    margin:30px auto;
    border-radius:18px;
    padding:20px;
    max-height:90vh;
    overflow:auto;
}

.close{
    float:left;
    border:0;
    background:#eee;
    border-radius:50%;
    width:35px;
    height:35px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.order input,
.order textarea{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
}

.order button{
    width:100%;
    border:0;
    background:#16823b;
    color:white;
    padding:13px;
    border-radius:10px;
    font-size:16px;
    margin-top:10px;
}

@media(max-width:800px){
    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .hero h1{
        font-size:27px;
    }

    .logo{
        font-size:20px;
    }

    .top{
        flex-wrap:wrap;
    }

    .search{
        order:3;
        flex-basis:100%;
    }
}

@media(max-width:450px){
    .products{
        gap:10px;
    }

    .product img{
        height:150px;
    }

    .product-info{
        padding:10px;
    }

    .product h3{
        font-size:15px;
    }
}
</style>
</head>

<body>

<header>

<div class="top">

<div class="logo">
🌿 مشتل الحديقة
</div>

<div class="search">
<input id="searchInput" type="text" placeholder="شن تبي تبحث عليه؟">
<button onclick="searchProducts()">🔍</button>
</div>

<button class="cart" onclick="openCart()">
🛒 السلة (<span id="cartCount">0</span>)
</button>

</div>

<div class="nav">

<button onclick="filterProducts('all')">الكل</button>
<button onclick="filterProducts('معشب')">🌱 معشب</button>
<button onclick="filterProducts('أشجار')">🌳 أشجار</button>
<button onclick="filterProducts('ورود')">🌹 ورود</button>
<button onclick="filterProducts('ري')">💧 شبكات ري</button>
<button onclick="filterProducts('أحجار')">🪨 أحجار وديكور</button>

</div>

</header>


<section class="hero">

<h1>كل ما تحتاجه لحديقتك 🌿</h1>

<p>
نباتات • معشب • أشجار • ورود • شبكات ري • تنسيق حدائق
</p>

<button onclick="document.getElementById('products').scrollIntoView()">
تسوق الآن
</button>

</section>


<div class="container">

<h2 class="title">التصنيفات</h2>

<div class="categories">

<div class="category" onclick="filterProducts('معشب')">
<div class="icon">🌱</div>
<b>المعشب</b>
</div>

<div class="category" onclick="filterProducts('أشجار')">
<div class="icon">🌳</div>
<b>الأشجار</b>
</div>

<div class="category" onclick="filterProducts('ورود')">
<div class="icon">🌹</div>
<b>الورود</b>
</div>

<div class="category" onclick="filterProducts('ري')">
<div class="icon">💧</div>
<b>شبكات الري</b>
</div>

</div>


<h2 class="title" id="products">منتجات مميزة</h2>

<div class="products" id="productList"></div>

</div>


<footer>

<h2>🌿 مشتل الحديقة</h2>

<p style="margin-top:10px">
نوفر لك كل ما تحتاجه لتنسيق حديقتك
</p>

<p style="margin-top:15px">
© 2026 مشتل الحديقة
</p>

</footer>


<!-- السلة -->

<div class="modal" id="cartModal">

<div class="box">

<button class="close" onclick="closeCart()">✕</button>

<h2>🛒 سلة المشتريات</h2>

<div id="cartItems"></div>

<h3 style="margin-top:15px">
الإجمالي: <span id="total">0</span> د.ل
</h3>

<div class="order">

<h3 style="margin-top:20px">بيانات الطلب</h3>

<input id="customerName" placeholder="اسم العميل">

<input id="customerPhone" placeholder="رقم الهاتف" type="tel">

<input id="customerAddress" placeholder="العنوان">

<textarea id="customerNotes" placeholder="ملاحظات إضافية"></textarea>

<button onclick="sendOrder()">
تأكيد الطلب 📦
</button>

</div>

</div>

</div>


<script>

const products = [

{
name:"معشب طبيعي أمريكي",
price:4,
category:"معشب",
image:"IMG_1242.jpeg"
},

{
name:"تويا تركية",
price:35,
category:"أشجار",
image:"https://cdn.shopify.com/s/files/1/0059/8835/2056/files/Thuja.jpg"
},

{
name:"ورد ونكة",
price:8,
category:"ورود",
image:"https://www.ondrovyzah­rady.cz/assets/plants.jpg"
},

{
name:"شبكة ري للحدائق",
price:25,
category:"ري",
image:"https://images.unsplash.com/photo-1585320806297-9794b3e4eeae"
},

{
name:"شجرة زينة",
price:45,
category:"أشجار",
image:"https://images.unsplash.com/photo-1545239351-1141bd82e8a6"
},

{
name:"ورد للحدائق",
price:10,
category:"ورود",
image:"https://images.unsplash.com/photo-1490750967868-88aa4486c946"
},

{
name:"أحجار ديكور",
price:12,
category:"أحجار",
image:"https://images.unsplash.com/photo-1598902108854-10e335adac99"
},

{
name:"نباتات زينة",
price:15,
category:"ورود",
image:"https://images.unsplash.com/photo-1485955900006-10f4d324d411"
}

];


let cart=[];


function displayProducts(list=products){

const box=document.getElementById("productList");

box.innerHTML="";

list.forEach((p,index)=>{

box.innerHTML+=`

<div class="product">

<img src="${p.image}" alt="${p.name}">

<div class="product-info">

<h3>${p.name}</h3>

<div class="price">
${p.price} د.ل
</div>

<button class="add" onclick="addToCart(${index})">
🛒 أضف للسلة
</button>

</div>

</div>

`;

});

}


function addToCart(index){

cart.push(products[index]);

updateCart();

alert("تمت إضافة المنتج للسلة ✅");

}


function updateCart(){

document.getElementById("cartCount").innerText=cart.length;

let items="";

let total=0;

cart.forEach((p,i)=>{

total+=p.price;

items+=`

<div class="cart-item">

<div>
<b>${p.name}</b>
<br>
${p.price} د.ل
</div>

<button onclick="removeFromCart(${i})">
🗑️
</button>

</div>

`;

});

document.getElementById("cartItems").innerHTML=
items || "<p style='margin-top:20px'>السلة فارغة</p>";

document.getElementById("total").innerText=total;

}


function removeFromCart(i){

cart.splice(i,1);

updateCart();

}


function openCart(){

document.getElementById("cartModal").style.display="block";

updateCart();

}


function closeCart(){

document.getElementById("cartModal").style.display="none";

}


function filterProducts(category){

if(category==="all"){

displayProducts();

return;

}

displayProducts(
products.filter(p=>p.category===category)
);

document.getElementById("products").scrollIntoView();

}


function searchProducts(){

const text=document
.getElementById("searchInput")
.value
.toLowerCase();

const result=products.filter(p=>
p.name.toLowerCase().includes(text)
);

displayProducts(result);

}


function sendOrder(){

if(cart.length===0){

alert("السلة فارغة");

return;

}

const name=document.getElementById("customerName").value;

const phone=document.getElementById("customerPhone").value;

const address=document.getElementById("customerAddress").value;

if(!name || !phone || !address){

alert("يرجى تعبئة اسم العميل ورقم الهاتف والعنوان");

return;

}

alert(
"✅ تم استلام طلبك بنجاح\n\nشكراً لك يا "+name
);

cart=[];

updateCart();

closeCart();

}


displayProducts();

</script>

</body>
</html>
