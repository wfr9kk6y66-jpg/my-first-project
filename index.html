<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشتل الحديقة</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Tahoma,sans-serif;
background:#f5f7f5;
color:#222;
}
header{
background:white;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 12px #0001;
}
.header{
max-width:1200px;
margin:auto;
padding:14px;
display:flex;
align-items:center;
gap:12px;
}
.logo{
font-size:23px;
font-weight:bold;
color:#16833c;
white-space:nowrap;
}
.search{
flex:1;
display:flex;
background:#f1f3f1;
border:1px solid #ddd;
border-radius:12px;
overflow:hidden;
}
.search input{
width:100%;
border:0;
outline:0;
background:none;
padding:13px;
font-size:15px;
}
.search button{
border:0;
background:#16833c;
color:white;
padding:0 18px;
font-size:18px;
}
.cart{
border:0;
background:#16833c;
color:white;
padding:12px 15px;
border-radius:11px;
font-size:15px;
}
.categories{
max-width:1200px;
margin:auto;
padding:0 14px 12px;
display:flex;
gap:8px;
overflow-x:auto;
}
.categories button{
border:0;
background:#edf5ef;
color:#176d38;
padding:9px 16px;
border-radius:20px;
white-space:nowrap;
}
.hero{
max-width:1200px;
margin:20px auto;
padding:42px 25px;
border-radius:20px;
background:linear-gradient(135deg,#126c35,#39a85e);
color:white;
}
.hero h1{
font-size:34px;
margin-bottom:12px;
}
.hero p{
font-size:17px;
line-height:1.8;
margin-bottom:20px;
}
.hero button{
border:0;
background:white;
color:#176d38;
padding:13px 25px;
border-radius:10px;
font-weight:bold;
font-size:15px;
}
.container{
max-width:1200px;
margin:auto;
padding:0 14px;
}
.title{
font-size:23px;
margin:28px 0 15px;
}
.category-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}
.category{
background:white;
padding:20px 10px;
border-radius:15px;
text-align:center;
box-shadow:0 2px 8px #0000000d;
}
.category-icon{
font-size:35px;
margin-bottom:8px;
}
.category b{
color:#176d38;
}
.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding-bottom:40px;
}
.product{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 2px 10px #0000000d;
}
.product img{
width:100%;
height:190px;
object-fit:cover;
background:#eee;
}
.product-info{
padding:13px;
}
.product h3{
font-size:16px;
margin-bottom:8px;
}
.price{
color:#16833c;
font-size:19px;
font-weight:bold;
margin-bottom:10px;
}
.add{
width:100%;
border:0;
background:#16833c;
color:white;
padding:11px;
border-radius:9px;
font-size:14px;
}
footer{
background:#173d27;
color:white;
text-align:center;
padding:30px;
}
.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:2000;
padding:18px;
}
.modal-box{
background:white;
max-width:520px;
margin:30px auto;
padding:20px;
border-radius:18px;
max-height:90vh;
overflow:auto;
}
.close{
float:left;
border:0;
background:#eee;
border-radius:50%;
width:34px;
height:34px;
}
.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px solid #eee;
}
.cart-item button{
border:0;
background:#fee;
padding:7px;
border-radius:7px;
}
.form{
margin-top:20px;
}
.form input,.form textarea{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ddd;
border-radius:9px;
outline:0;
font-size:14px;
}
.form textarea{
height:80px;
resize:none;
}
.confirm{
width:100%;
border:0;
background:#16833c;
color:white;
padding:13px;
border-radius:10px;
font-size:16px;
margin-top:8px;
}
.empty{
padding:20px 0;
text-align:center;
color:#777;
}
@media(max-width:800px){
.products{grid-template-columns:repeat(2,1fr)}
.category-grid{grid-template-columns:repeat(2,1fr)}
.hero h1{font-size:27px}
.header{flex-wrap:wrap}
.logo{font-size:20px}
.search{order:3;flex-basis:100%}
}
@media(max-width:450px){
.product img{height:150px}
.products{gap:10px}
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">🌿 مشتل الحديقة</div>

<div class="search">
<input id="search" placeholder="شن تبي تبحث عليه؟">
<button onclick="searchProducts()">🔍</button>
</div>

<button class="cart" onclick="openCart()">
🛒 السلة (<span id="count">0</span>)
</button>

</div>

<div class="categories">
<button onclick="filterProducts('الكل')">الكل</button>
<button onclick="filterProducts('معشب')">🌱 معشب</button>
<button onclick="filterProducts('أشجار')">🌳 أشجار</button>
<button onclick="filterProducts('ورود')">🌹 ورود</button>
<button onclick="filterProducts('ري')">💧 ري</button>
<button onclick="filterProducts('أحجار')">🪨 أحجار</button>
</div>

</header>

<section class="hero">

<h1>كل ما تحتاجه لحديقتك 🌿</h1>

<p>
معشب • أشجار • ورود • نباتات زينة • شبكات ري • أحجار وديكور
</p>

<button onclick="document.getElementById('products').scrollIntoView()">
تسوق الآن
</button>

</section>

<div class="container">

<h2 class="title">التصنيفات</h2>

<div class="category-grid">

<div class="category" onclick="filterProducts('معشب')">
<div class="category-icon">🌱</div>
<b>المعشب</b>
</div>

<div class="category" onclick="filterProducts('أشجار')">
<div class="category-icon">🌳</div>
<b>الأشجار</b>
</div>

<div class="category" onclick="filterProducts('ورود')">
<div class="category-icon">🌹</div>
<b>الورود</b>
</div>

<div class="category" onclick="filterProducts('ري')">
<div class="category-icon">💧</div>
<b>شبكات الري</b>
</div>

</div>

<h2 class="title" id="products">المنتجات</h2>

<div class="products" id="productList"></div>

</div>

<footer>

<h2>🌿 مشتل الحديقة</h2>

<p style="margin-top:10px">
جودة • تنسيق • زراعة • ري
</p>

<p style="margin-top:15px">
© 2026 مشتل الحديقة
</p>

</footer>


<div class="modal" id="cartModal">

<div class="modal-box">

<button class="close" onclick="closeCart()">✕</button>

<h2>🛒 سلة المشتريات</h2>

<div id="cartItems"></div>

<h3 style="margin-top:15px">
الإجمالي: <span id="total">0</span> د.ل
</h3>

<div class="form">

<h3>بيانات العميل</h3>

<input id="name" placeholder="اسم العميل">

<input id="phone" type="tel" placeholder="رقم الهاتف">

<input id="address" placeholder="العنوان">

<textarea id="notes" placeholder="ملاحظات الطلب"></textarea>

<button class="confirm" onclick="sendOrder()">
تأكيد الطلب 📦
</button>

</div>

</div>

</div>


<script>

const products=[

{
name:"معشب طبيعي أمريكي",
price:4,
category:"معشب",
image:"IMG_1242.jpeg"
},

{
name:"تويا تركية",
price:35,
category:"أشجار",
image:"https://images.unsplash.com/photo-1545239351-1141bd82e8a6"
},

{
name:"ورد الونكة",
price:8,
category:"ورود",
image:"https://images.unsplash.com/photo-1490750967868-88aa4486c946"
},

{
name:"شبكة ري للحدائق",
price:25,
category:"ري",
image:"https://images.unsplash.com/photo-1585320806297-9794b3e4eeae"
},

{
name:"شجرة زينة",
price:45,
category:"أشجار",
image:"https://images.unsplash.com/photo-1599598425947-3304b8b7d8ef"
},

{
name:"نباتات زينة",
price:15,
category:"ورود",
image:"https://images.unsplash.com/photo-1485955900006-10f4d324d411"
},

{
name:"أحجار ديكور",
price:12,
category:"أحجار",
image:"https://images.unsplash.com/photo-1598902108854-10e335adac99"
},

{
name:"ورد للحدائق",
price:10,
category:"ورود",
image:"https://images.unsplash.com/photo-1497250681960-ef046c08a56e"
}

];

let cart=[];

function displayProducts(list=products){

let box=document.getElementById("productList");

box.innerHTML="";

list.forEach((p)=>{

let index=products.indexOf(p);

box.innerHTML+=`

<div class="product">

<img src="${p.image}" alt="${p.name}">

<div class="product-info">

<h3>${p.name}</h3>

<div class="price">${p.price} د.ل</div>

<button class="add" onclick="addToCart(${index})">
🛒 أضف للسلة
</button>

</div>

</div>

`;

});

}

function addToCart(index){

cart.push(products[index]);

updateCart();

}

function updateCart(){

document.getElementById("count").innerText=cart.length;

let html="";
let total=0;

cart.forEach((p,i)=>{

total+=p.price;

html+=`

<div class="cart-item">

<div>
<b>${p.name}</b>
<br>
${p.price} د.ل
</div>

<button onclick="removeItem(${i})">
🗑️
</button>

</div>

`;

});

document.getElementById("cartItems").innerHTML=
html || '<div class="empty">السلة فارغة 🛒</div>';

document.getElementById("total").innerText=total;

}

function removeItem(i){

cart.splice(i,1);

updateCart();

}

function openCart(){

document.getElementById("cartModal").style.display="block";

updateCart();

}

function closeCart(){

document.getElementById("cartModal").style.display="none";

}

function filterProducts(category){

if(category==="الكل"){

displayProducts();

}else{

displayProducts(
products.filter(p=>p.category===category)
);

}

document.getElementById("products").scrollIntoView();

}

function searchProducts(){

let text=document
.getElementById("search")
.value
.toLowerCase();

let result=products.filter(p=>
p.name.toLowerCase().includes(text)
);

displayProducts(result);

}

function sendOrder(){

if(cart.length===0){

alert("السلة فارغة");

return;

}

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let address=document.getElementById("address").value;

if(!name || !phone || !address){

alert("يرجى تعبئة اسم العميل ورقم الهاتف والعنوان");

return;

}

alert(
"✅ تم استلام طلبك بنجاح\n\nشكراً لك "+name
);

cart=[];

updateCart();

closeCart();

}

displayProducts();

</script>

</body>
</html>
